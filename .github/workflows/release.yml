name: Release

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Environment
        default: production
        options:
          - production
          - dev

permissions:
  contents: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Bump version
        id: version
        run: |
          npx @circlesac/oneup version
          VERSION=$(node -p "require('./package.json').version")

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('npm/package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('npm/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          sed -i 's/version: ".*"/version: "'${VERSION}'"/' src/index.ts

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: versioned-files
          path: |
            package.json
            npm/package.json
            src/index.ts

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: shh-env-darwin-arm64
            ext: tar.gz
          - os: macos-latest
            target: bun-darwin-x64
            name: shh-env-darwin-x64
            ext: tar.gz
          - os: ubuntu-latest
            target: bun-linux-x64
            name: shh-env-linux-x64
            ext: tar.gz
          - os: ubuntu-latest
            target: bun-linux-arm64
            name: shh-env-linux-arm64
            ext: tar.gz
          - os: ubuntu-latest
            target: bun-windows-x64
            name: shh-env-windows-x64
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: versioned-files

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "bun-windows-x64" ]; then
            bun build --compile --target=${{ matrix.target }} --outfile=shh-env.exe src/index.ts
            zip ${{ matrix.name }}.zip shh-env.exe
          else
            bun build --compile --target=${{ matrix.target }} --outfile=shh-env src/index.ts
            if [[ "${{ matrix.target }}" == bun-darwin-* ]]; then
              codesign --remove-signature shh-env
              codesign --force --deep -s - shh-env
            fi
            tar czf ${{ matrix.name }}.tar.gz shh-env
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.${{ matrix.ext }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: versioned-files

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json npm/package.json src/index.ts
          git commit -m "Release v${{ needs.version.outputs.version }}"
          git tag -f "v${{ needs.version.outputs.version }}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move tarballs to root
        run: |
          find artifacts -name "*.tar.gz" -exec cp {} . \;
          find artifacts -name "*.zip" -exec cp {} . \;

      - name: Publish to npm
        run: npm publish --access public --tag ${{ inputs.env == 'production' && 'latest' || inputs.env }} ./npm

      - name: Push
        run: git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
          prerelease: ${{ inputs.env != 'production' }}

      - name: Update Homebrew formula
        if: inputs.env == 'production'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ needs.version.outputs.version }}
          SHA_DARWIN_ARM64=$(shasum -a 256 shh-env-darwin-arm64.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_X64=$(shasum -a 256 shh-env-darwin-x64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 shh-env-linux-arm64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X64=$(shasum -a 256 shh-env-linux-x64.tar.gz | cut -d' ' -f1)

          git clone https://x-access-token:${GH_TOKEN}@github.com/circlesac/homebrew-tap.git
          cd homebrew-tap

          cp ../homebrew/shh-env.rb.template Formula/shh-env.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/shh-env.rb
          sed -i "s/SHA_DARWIN_ARM64/${SHA_DARWIN_ARM64}/g" Formula/shh-env.rb
          sed -i "s/SHA_DARWIN_X64/${SHA_DARWIN_X64}/g" Formula/shh-env.rb
          sed -i "s/SHA_LINUX_ARM64/${SHA_LINUX_ARM64}/g" Formula/shh-env.rb
          sed -i "s/SHA_LINUX_X64/${SHA_LINUX_X64}/g" Formula/shh-env.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/shh-env.rb
          git commit -m "Update shh-env to ${VERSION}"
          git push
